version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: portfolioforge_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
      POSTGRES_DB: portfolioforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolioforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolioforge_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword123@db:5432/portfolioforge?schema=public
      - JWT_ACCESS_SECRET=production-access-token-secret-key-should-be-changed
      - JWT_REFRESH_SECRET=production-refresh-token-secret-key-should-be-changed
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - CORS_ORIGIN=http://localhost:3000
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
      - UPLOAD_DIR=uploads
      - MAX_FILE_SIZE_MB=5
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local
